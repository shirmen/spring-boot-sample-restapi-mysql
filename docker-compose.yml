services:
  mysql:
    image: mysql:8.4
    container_name: spring-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: taskdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: